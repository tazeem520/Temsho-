<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1350" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradSR" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="headerGradSR" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="50%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="stepGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <filter id="shadowSR" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="1350" fill="url(#bgGradSR)"/>

  <!-- Top Header Banner -->
  <rect x="30" y="30" width="840" height="140" rx="20" fill="url(#headerGradSR)" filter="url(#shadowSR)"/>
  <circle cx="85" cy="100" r="32" fill="#FFFFFF" fill-opacity="0.2"/>
  <text x="85" y="110" font-family="sans-serif" font-size="34" font-weight="900" fill="#FFFFFF" text-anchor="middle">🚚</text>
  <text x="135" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="900" fill="#FFFFFF">Shiprocket Setup Guide — Temsho</text>
  <text x="135" y="120" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#E0E7FF">Har Seller Apne Address Se Parcel Kaise Bheje (Step-by-Step)</text>

  <!-- Main Container -->
  <g transform="translate(50, 200)" filter="url(#shadowSR)">
    <rect width="800" height="1100" rx="24" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>

    <!-- HOW IT WORKS OVERVIEW -->
    <g transform="translate(35, 30)">
      <rect x="0" y="0" width="730" height="110" rx="16" fill="#F0FDF4" stroke="#86EFAC" stroke-width="2"/>
      <text x="25" y="34" font-family="sans-serif" font-size="18" font-weight="900" fill="#166534">📦 Multi-Seller Shipping Kaise Kaam Karegi?</text>
      <text x="25" y="65" font-family="sans-serif" font-size="13.5" font-weight="600" fill="#14532D">1. Seller apna dukan/ghar ka pata aur PIN code daalega.</text>
      <text x="25" y="90" font-family="sans-serif" font-size="13.5" font-weight="600" fill="#14532D">2. Order aane par Delhivery/BlueDart ka rider SELLER KE GHAR jakar parcel pick karega!</text>
    </g>

    <!-- STEP 1: FREE SIGNUP -->
    <g transform="translate(35, 160)">
      <rect x="0" y="0" width="730" height="185" rx="16" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="2"/>
      <circle cx="35" cy="35" r="16" fill="#2563EB"/>
      <text x="35" y="41" font-family="sans-serif" font-size="15" font-weight="900" fill="#FFFFFF" text-anchor="middle">1</text>
      <text x="65" y="40" font-family="sans-serif" font-size="18" font-weight="900" fill="#1E40AF">Step 1: Shiprocket par ₹0 me Free Account banayein</text>

      <rect x="35" y="65" width="660" height="42" rx="8" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
      <text x="50" y="92" font-family="monospace" font-size="15.5" font-weight="800" fill="#1D4ED8">👉 https://app.shiprocket.in/register</text>

      <text x="35" y="130" font-family="sans-serif" font-size="13" font-weight="600" fill="#334155">• Name: Tazeem Ahmad | Company: Temsho</text>
      <text x="35" y="152" font-family="sans-serif" font-size="13" font-weight="600" fill="#334155">• Email: tazeemahmadsbn12@gmail.com | Phone: 9044468663</text>
    </g>

    <!-- STEP 2: CREATE API USER -->
    <g transform="translate(35, 365)">
      <rect x="0" y="0" width="730" height="200" rx="16" fill="#FAF5FF" stroke="#E9D5FF" stroke-width="2"/>
      <circle cx="35" cy="35" r="16" fill="#7C3AED"/>
      <text x="35" y="41" font-family="sans-serif" font-size="15" font-weight="900" fill="#FFFFFF" text-anchor="middle">2</text>
      <text x="65" y="40" font-family="sans-serif" font-size="18" font-weight="900" fill="#581C87">Step 2: Shiprocket Dashboard me API User banayein</text>

      <text x="35" y="75" font-family="sans-serif" font-size="14" font-weight="700" fill="#334155">1. Shiprocket me login karein ➔ बायीं तरफ़ नीचे <tspan font-weight="900" fill="#7C3AED">Settings ⚙️</tspan> dabayein</text>
      <text x="35" y="105" font-family="sans-serif" font-size="14" font-weight="700" fill="#334155">2. <tspan font-weight="900" fill="#7C3AED">API ➔ Configure</tspan> par click karein</text>
      <text x="35" y="135" font-family="sans-serif" font-size="14" font-weight="700" fill="#334155">3. <tspan font-weight="900" fill="#2563EB">"Add New User"</tspan> dabayein aur ek Email &amp; Password set karein</text>
      <text x="35" y="165" font-family="sans-serif" font-size="13" font-weight="700" fill="#059669">👉 Jaise: Email = api@temsho.in, Password = TemshoShip@123</text>
    </g>

    <!-- STEP 3: PASTE IN CONFIG -->
    <g transform="translate(35, 585)">
      <rect x="0" y="0" width="730" height="200" rx="16" fill="#FFF7ED" stroke="#FED7AA" stroke-width="2"/>
      <circle cx="35" cy="35" r="16" fill="#EA580C"/>
      <text x="35" y="41" font-family="sans-serif" font-size="15" font-weight="900" fill="#FFFFFF" text-anchor="middle">3</text>
      <text x="65" y="40" font-family="sans-serif" font-size="18" font-weight="900" fill="#9A3412">Step 3: App me Shiprocket API jodein</text>

      <text x="35" y="75" font-family="sans-serif" font-size="14" font-weight="700" fill="#334155">Bas ye 2 details mujhe chat me bhej dijiye ya <tspan font-weight="900" fill="#2563EB">src/config.js</tspan> me daaliye:</text>

      <rect x="35" y="90" width="660" height="85" rx="10" fill="#1E293B"/>
      <text x="50" y="122" font-family="monospace" font-size="14" fill="#38BDF8">SHIPROCKET: {</text>
      <text x="70" y="145" font-family="monospace" font-size="14" fill="#A7F3D0">  email: 'api@temsho.in', password: 'YourPassword'</text>
      <text x="50" y="168" font-family="monospace" font-size="14" fill="#38BDF8">}</text>
    </g>

    <!-- STEP 4: HOW SELLER DISPATCHES -->
    <g transform="translate(35, 805)">
      <rect x="0" y="0" width="730" height="260" rx="16" fill="#0F172A"/>
      <text x="30" y="38" font-family="sans-serif" font-size="18" font-weight="900" fill="#FDE047">🚀 लाइव सेलर शिपिंग कैसे होगी?</text>

      <text x="30" y="78" font-family="sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">1. <tspan fill="#38BDF8">Customer Order Karega</tspan> ➔ Seller ke phone me notification aayega.</text>
      <text x="30" y="115" font-family="sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">2. <tspan fill="#4ADE80">Seller "Dispatch via Shiprocket" Dabata Hai</tspan> ➔ Turant AWB number banega.</text>
      <text x="30" y="152" font-family="sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">3. <tspan fill="#F472B6">Courier Doorstep Pickup</tspan> ➔ Delhivery ka rider seller ke address se packet uthayega.</text>
      <text x="30" y="189" font-family="sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">4. <tspan fill="#FDE047">Live GPS Tracking</tspan> ➔ Customer aur Seller dono app me live track kar sakte hain.</text>

      <rect x="30" y="215" width="670" height="32" rx="6" fill="#FFFFFF" fill-opacity="0.1"/>
      <text x="45" y="236" font-family="sans-serif" font-size="12.5" font-weight="800" fill="#4ADE80">✨ Seller ko kisi post office ya courier office jaane ki zarurat nahi padegi!</text>
    </g>
  </g>
</svg>
