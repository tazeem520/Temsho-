<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14172E"/>
      <stop offset="100%" stop-color="#23274D"/>
    </linearGradient>
    <linearGradient id="headerGrad3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#12A150"/>
      <stop offset="50%" stop-color="#0F7A4A"/>
      <stop offset="100%" stop-color="#2B2D6E"/>
    </linearGradient>
    <linearGradient id="btnGrad3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0080FF"/>
      <stop offset="100%" stop-color="#0055FF"/>
    </linearGradient>
    <filter id="shadow3" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="1300" fill="url(#bgGrad3)"/>

  <!-- Top Header Banner -->
  <rect x="30" y="30" width="840" height="130" rx="20" fill="url(#headerGrad3)" filter="url(#shadow3)"/>
  <circle cx="85" cy="95" r="32" fill="#FFFFFF" fill-opacity="0.2"/>
  <text x="85" y="105" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" fill="#FFFFFF" text-anchor="middle">🔑</text>
  <text x="135" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="900" fill="#FFFFFF">बधाई! आपका Expo प्रोजेक्ट तैयार है 🎉</text>
  <text x="135" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#E4F7EC">अब आख़िरी 1 क़दम: Access Token कॉपी करके मुझे दीजिए</text>

  <!-- Main Card -->
  <g transform="translate(60, 190)" filter="url(#shadow3)">
    <rect width="780" height="850" rx="24" fill="#FFFFFF" stroke="#E0E4F0" stroke-width="2"/>

    <!-- STEP 1: Open Settings Link -->
    <g transform="translate(40, 40)">
      <rect x="0" y="0" width="700" height="155" rx="16" fill="#F0F4FF" stroke="#4E54C8" stroke-width="2"/>
      
      <circle cx="35" cy="35" r="16" fill="#2B2D6E"/>
      <text x="35" y="41" font-family="sans-serif" font-size="15" font-weight="900" fill="#FFFFFF" text-anchor="middle">1</text>
      
      <text x="65" y="38" font-family="sans-serif" font-size="18" font-weight="900" fill="#141726">यह लिंक अपने ब्राउज़र में खोलिए:</text>
      
      <rect x="35" y="65" width="630" height="48" rx="10" fill="#FFFFFF" stroke="#2B2D6E" stroke-width="1.5"/>
      <text x="50" y="96" font-family="monospace" font-size="17" font-weight="900" fill="#0066FF">https://expo.dev/settings/access-tokens</text>

      <text x="35" y="135" font-family="sans-serif" font-size="13" font-weight="700" fill="#4B5563">👉 या दाईं तरफ़ ऊपर प्रोफाइल आइकॉन ➔ User Settings ➔ Access Tokens</text>
    </g>

    <!-- STEP 2: Click Create Token -->
    <g transform="translate(40, 225)">
      <rect x="0" y="0" width="700" height="165" rx="16" fill="#F0F4FF" stroke="#4E54C8" stroke-width="2"/>
      
      <circle cx="35" cy="35" r="16" fill="#2B2D6E"/>
      <text x="35" y="41" font-family="sans-serif" font-size="15" font-weight="900" fill="#FFFFFF" text-anchor="middle">2</text>
      
      <text x="65" y="38" font-family="sans-serif" font-size="18" font-weight="900" fill="#141726">नीला बटन "Create token" दबाएं:</text>
      
      <rect x="35" y="65" width="220" height="46" rx="8" fill="url(#btnGrad3)"/>
      <text x="145" y="94" font-family="sans-serif" font-size="16" font-weight="900" fill="#FFFFFF" text-anchor="middle">+ Create token</text>

      <rect x="275" y="65" width="390" height="46" rx="8" fill="#FFFFFF" stroke="#D1D5DB"/>
      <text x="290" y="93" font-family="sans-serif" font-size="14" font-weight="600" fill="#6B7280">Token name: <tspan font-weight="900" fill="#141726">Temsho APK</tspan></text>

      <text x="35" y="145" font-family="sans-serif" font-size="13" font-weight="700" fill="#4B5563">💡 Token Name me "Temsho APK" likhkar "Create" dabayein.</text>
    </g>

    <!-- STEP 3: Copy & Paste -->
    <g transform="translate(40, 420)">
      <rect x="0" y="0" width="700" height="175" rx="16" fill="#E4F7EC" stroke="#12A150" stroke-width="2"/>
      
      <circle cx="35" cy="35" r="16" fill="#12A150"/>
      <text x="35" y="41" font-family="sans-serif" font-size="15" font-weight="900" fill="#FFFFFF" text-anchor="middle">3</text>
      
      <text x="65" y="38" font-family="sans-serif" font-size="18" font-weight="900" fill="#0F7A4A">टोकन (Token) कॉपी करके मुझे चैट में पेस्ट कर दीजिए:</text>
      
      <rect x="35" y="65" width="630" height="52" rx="10" fill="#FFFFFF" stroke="#12A150" stroke-width="2"/>
      <text x="55" y="98" font-family="monospace" font-size="17" font-weight="900" fill="#141726">eyJh... (लम्बा कोड दिखेगा, Copy बटन दबाएं)</text>

      <text x="35" y="148" font-family="sans-serif" font-size="13.5" font-weight="800" fill="#0F7A4A">👉 बस वह कोड कॉपी करके यहाँ चैट में भेज दीजिए!</text>
    </g>

    <!-- STEP 4: What I will do -->
    <g transform="translate(40, 625)">
      <rect x="0" y="0" width="700" height="185" rx="16" fill="#1E224F"/>
      
      <text x="30" y="38" font-family="sans-serif" font-size="18" font-weight="900" fill="#FFD54F">🚀 टोकन मिलते ही मैं क्या करूँगा?</text>
      
      <text x="30" y="75" font-family="sans-serif" font-size="14.5" font-weight="700" fill="#FFFFFF">1. मैं तुरंत EAS Build कमांड चला दूंगा।</text>
      <text x="30" y="105" font-family="sans-serif" font-size="14.5" font-weight="700" fill="#FFFFFF">2. Expo क्लाउड आपके Temsho ऐप की .apk फ़ाइल बनाएगा।</text>
      <text x="30" y="135" font-family="sans-serif" font-size="14.5" font-weight="700" fill="#25D366">3. 10 मिनट में आपको सीधा APK Download Link मिल जाएगा!</text>
      
      <rect x="30" y="150" width="640" height="2" fill="#FFFFFF" fill-opacity="0.1"/>
    </g>
  </g>

  <!-- Bottom Banner -->
  <g transform="translate(60, 1070)" filter="url(#shadow3)">
    <rect width="780" height="190" rx="20" fill="#0F7A4A" stroke="#25D366" stroke-width="2"/>
    <text x="40" y="42" font-family="sans-serif" font-size="20" font-weight="900" fill="#FFFFFF">✨ APK डाउनलोड लिंक तुरंत तैयार हो जाएगा!</text>
    <text x="40" y="80" font-family="sans-serif" font-size="15" font-weight="600" fill="#E4F7EC">जैसे ही टोकन मिलेगा, Android APK की क्लाउड बिल्ड तुरंत चालू हो जाएगी।</text>
    <text x="40" y="115" font-family="sans-serif" font-size="15" font-weight="800" fill="#FFD54F">सीधा लिंक: https://expo.dev/settings/access-tokens</text>
  </g>
</svg>
